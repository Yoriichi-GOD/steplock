name: Prelaunch regression and Linux container
on:
  push:
    branches: [prelaunch-experience, industrial-requiem]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.lock.txt
      - name: Frontend regression and production build
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Backend regression
        run: .venv/bin/python -m pytest backend/tests -q
      - name: Build Linux production image
        run: docker build -t steplock-prelaunch:ci .
      - name: Actual container HTTP smoke
        run: |
          docker run -d --name steplock-ci -p 127.0.0.1:8000:8000 steplock-prelaunch:ci
          python scripts/smoke_public_demo.py | tee container-smoke.json
          docker image inspect steplock-prelaunch:ci --format '{{.Id}}' > container-image-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: steplock-linux-container-proof
          path: |
            container-smoke.json
            container-image-id.txt
      - name: Container diagnostics
        if: failure()
        run: docker logs steplock-ci || true
      - name: Stop temporary test container
        if: always()
        run: docker rm -f steplock-ci || true
