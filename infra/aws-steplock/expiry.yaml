AWSTemplateFormatVersion: '2010-09-09'
Description: Seven-day STEPLOCK trial expiry. Only the inventoried trial stacks/resources may be deleted. This small control stack is retained for audit.
Parameters:
  ServiceStackArn: {Type: String}
  FoundationStackArn: {Type: String}
  ProbeStackArn: {Type: String}
  DeletionResourceArns: {Type: CommaDelimitedList}
  TrialRoleArns: {Type: CommaDelimitedList}
  TeardownAt:
    Type: String
    AllowedPattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'
  FoundationTeardownAt:
    Type: String
    AllowedPattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'
  ProbeAt:
    Type: String
    AllowedPattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'
Resources:
  DeletionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-resources'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeleteOnlyInventoriedTrialResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDeletionState
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNetworkAcls
                  - logs:DescribeLogGroups
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeExpressGatewayService
                  - ecs:DescribeServiceRevisions
                Resource: '*'
              - Sid: InventoriedDeletionOnly
                Effect: Allow
                Action:
                  - ec2:DeleteVpc
                  - ec2:DeleteSubnet
                  - ec2:DeleteRouteTable
                  - ec2:DeleteRoute
                  - ec2:DisassociateRouteTable
                  - ec2:DetachInternetGateway
                  - ec2:DeleteInternetGateway
                  - ecs:DeleteCluster
                  - ecs:DeleteExpressGatewayService
                  - ecr:DeleteRepository
                  - logs:DeleteLogGroup
                  - logs:DeleteDataProtectionPolicy
                  - iam:DeleteRole
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - codebuild:DeleteProject
                  - codebuild:DeleteWebhook
                  - codebuild:BatchGetProjects
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:DeleteIPSet
                  - wafv2:GetIPSet
                  - wafv2:DisassociateWebACL
                  - wafv2:GetWebACLForResource
                  - elasticloadbalancing:SetWebACL
                  - elasticloadbalancing:DeleteWebACLAssociation
                  - elasticloadbalancing:GetLoadBalancerWebACL
                Resource: !Ref DeletionResourceArns
              - Sid: PassOnlyTrialRolesForCleanup
                Effect: Allow
                Action: iam:PassRole
                Resource: !Ref TrialRoleArns
                Condition:
                  StringEquals:
                    iam:PassedToService: [codebuild.amazonaws.com, ecs.amazonaws.com, ecs-tasks.amazonaws.com]
      Tags: [{Key: Project, Value: STEPLOCK}]
  ExpiryGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Ref AWS::StackName
      Tags: [{Key: Project, Value: STEPLOCK}]
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-scheduler'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
              ArnEquals: {aws:SourceArn: !GetAtt ExpiryGroup.Arn}
      Policies:
        - PolicyName: DeleteOnlyTheseStacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DeleteStack
                Resource: [!Ref ServiceStackArn, !Ref FoundationStackArn, !Ref ProbeStackArn]
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt DeletionRole.Arn
                Condition: {StringEquals: {iam:PassedToService: cloudformation.amazonaws.com}}
      Tags: [{Key: Project, Value: STEPLOCK}]
  ServiceExpiry:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref ExpiryGroup
      Name: service-teardown
      ScheduleExpression: !Sub 'at(${TeardownAt})'
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !Sub 'arn:${AWS::Partition}:scheduler:::aws-sdk:cloudformation:deleteStack'
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"StackName":"${ServiceStackArn}","RoleARN":"${DeletionRole.Arn}"}'
        RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 3}
  FoundationExpiry:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref ExpiryGroup
      Name: foundation-teardown
      ScheduleExpression: !Sub 'at(${FoundationTeardownAt})'
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !Sub 'arn:${AWS::Partition}:scheduler:::aws-sdk:cloudformation:deleteStack'
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"StackName":"${FoundationStackArn}","RoleARN":"${DeletionRole.Arn}"}'
        RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 3}
  ExpiryProbe:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref ExpiryGroup
      Name: verify-delete-path
      ScheduleExpression: !Sub 'at(${ProbeAt})'
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !Sub 'arn:${AWS::Partition}:scheduler:::aws-sdk:cloudformation:deleteStack'
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"StackName":"${ProbeStackArn}","RoleARN":"${DeletionRole.Arn}"}'
        RetryPolicy: {MaximumEventAgeInSeconds: 900, MaximumRetryAttempts: 2}
Outputs:
  ServiceTeardownUTC: {Value: !Ref TeardownAt}
  FoundationTeardownUTC: {Value: !Ref FoundationTeardownAt}
  DeletionRoleArn: {Value: !GetAtt DeletionRole.Arn}
  SchedulerRoleArn: {Value: !GetAtt SchedulerRole.Arn}
